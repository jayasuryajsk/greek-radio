<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ελληνικό Ραδιόφωνο">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Ελληνικό Ραδιόφωνο & TV · Greek Radio & TV</title>
<style>
  :root {
    --bg: #0d1117; --card: #161b22; --card2: #1f2630; --line: #2a313c;
    --text: #e6e9ef; --dim: #8b95a5; --acc: #4da3ff; --live: #ff4d5e;
    --gold: #ffd166; --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: -apple-system, "Segoe UI", Roboto, sans-serif;
    padding-bottom: calc(96px + var(--safe-b));
  }
  header {
    position: sticky; top: 0; z-index: 10; background: rgba(13,17,23,.94);
    backdrop-filter: blur(12px);
    padding: calc(env(safe-area-inset-top,0px) + 10px) 14px 8px;
    border-bottom: 1px solid var(--line);
  }
  #tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .tab {
    flex: 1; padding: 9px 0; text-align: center; font-size: 14px; font-weight: 600;
    border-radius: 11px; background: var(--card); color: var(--dim); border: 1px solid var(--line);
  }
  .tab.on { background: var(--acc); color: #fff; border-color: var(--acc); }
  #search {
    width: 100%; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); font-size: 16px; outline: none;
  }
  #chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: none; }
  #chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; padding: 7px 13px; border-radius: 999px; font-size: 13px;
    background: var(--card); border: 1px solid var(--line); color: var(--dim);
  }
  .chip.on { background: var(--acc); border-color: var(--acc); color: #fff; font-weight: 600; }
  main { padding: 6px 14px; }
  .sec {
    font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--dim); margin: 18px 4px 8px;
  }
  .st {
    display: flex; align-items: center; gap: 12px; padding: 11px 12px;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    margin-bottom: 8px; cursor: pointer;
  }
  .st:active { background: var(--card2); }
  .st.playing { border-color: var(--live); }
  .st img {
    width: 44px; height: 44px; border-radius: 10px; background: var(--card2);
    object-fit: contain; flex: 0 0 44px;
  }
  .st.tv img { width: 64px; height: 40px; object-fit: contain; }
  .st .m { min-width: 0; flex: 1; }
  .st .n { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .st .g { font-size: 12px; color: var(--dim); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge {
    flex: 0 0 auto; font-size: 10px; font-weight: 700; padding: 3px 7px;
    border-radius: 6px; background: var(--card2); color: var(--gold); border: 1px solid var(--gold);
  }
  .live { flex: 0 0 auto; width: 10px; height: 10px; border-radius: 50%;
    background: var(--live); animation: p 1.2s infinite; }
  @keyframes p { 50% { opacity: .25; } }
  .fav {
    flex: 0 0 auto; font-size: 20px; color: var(--dim); padding: 8px 4px 8px 8px;
    -webkit-user-select: none; user-select: none;
  }
  .fav.on { color: var(--gold); }
  #player {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: rgba(22,27,34,.97); backdrop-filter: blur(14px);
    border-top: 1px solid var(--line);
    padding: 12px 16px calc(12px + var(--safe-b));
    display: none; align-items: center; gap: 12px;
  }
  #player.show { display: flex; }
  #pimg { width: 48px; height: 48px; border-radius: 10px; background: var(--card2); object-fit: contain; }
  #pinfo { flex: 1; min-width: 0; }
  #pname { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #pstat { font-size: 12px; color: var(--dim); margin-top: 3px; }
  #pstat.live { color: var(--live); font-weight: 600; }
  #ppause {
    width: 52px; height: 52px; border-radius: 50%; border: none; background: var(--acc);
    color: #fff; font-size: 20px; flex: 0 0 52px; cursor: pointer;
  }
  #pstop {
    width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--card); color: var(--dim); font-size: 16px; flex: 0 0 40px; cursor: pointer;
  }
  .empty { text-align: center; color: var(--dim); padding: 60px 20px; font-size: 14px; }

  /* TV fullscreen overlay */
  #tv {
    position: fixed; inset: 0; z-index: 40; background: #000; display: none;
    flex-direction: column;
  }
  #tv.show { display: flex; }
  #tvtop {
    display: flex; align-items: center; gap: 10px;
    padding: calc(env(safe-area-inset-top,0px) + 12px) 16px 10px;
    background: #000; color: #fff;
  }
  #tvback { background: none; border: none; color: var(--acc); font-size: 30px; line-height: 1; padding: 0 8px 0 0; }
  #tvname { font-size: 16px; font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #tvsite { font-size: 12px; color: var(--acc); text-decoration: none; }
  #tv video { width: 100%; flex: 1; background: #000; }
  #tvmsg { color: var(--dim); text-align: center; padding: 20px; font-size: 14px; }

  /* Episodes sheet */
  #eps {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; max-height: 78vh;
    background: var(--card); border-radius: 18px 18px 0 0; border: 1px solid var(--line);
    display: none; flex-direction: column;
    padding-bottom: var(--safe-b);
  }
  #eps.show { display: flex; }
  #epsh { display: flex; align-items: center; padding: 14px 16px 8px; }
  #epstitle { flex: 1; font-size: 16px; font-weight: 700; }
  #epsclose { background: var(--card2); color: var(--dim); border: none; border-radius: 50%; width: 30px; height: 30px; font-size: 14px; }
  #epslist { overflow-y: auto; padding: 4px 12px 14px; }
  .ep {
    display: flex; align-items: center; gap: 10px; padding: 12px;
    border-bottom: 1px solid var(--line); cursor: pointer;
  }
  .ep:last-child { border-bottom: none; }
  .ep .en { font-size: 15px; }
  .ep .eg { font-size: 12px; color: var(--dim); margin-top: 2px; }
  .ep .go { margin-left: auto; color: var(--acc); font-size: 20px; }
  .spin { text-align: center; color: var(--dim); padding: 30px; font-size: 14px; }
</style>
</head>
<body>
<header>
  <div id="tabs">
    <div class="tab on" data-t="radio">♪ Ραδιόφωνο</div>
    <div class="tab" data-t="tv">▶ Τηλεόραση</div>
    <div class="tab" data-t="shows">★ Εκπομπές</div>
  </div>
  <input id="search" type="search" placeholder="Αναζήτηση · Search…">
  <div id="chips"></div>
</header>
<main id="list"></main>

<div id="player">
  <img id="pimg" alt="">
  <div id="pinfo">
    <div id="pname"></div>
    <div id="pstat">Σύνδεση…</div>
  </div>
  <button id="ppause" aria-label="pause">❚❚</button>
  <button id="pstop" aria-label="stop">✕</button>
</div>

<div id="tv">
  <div id="tvtop">
    <button id="tvback" aria-label="back">‹</button>
    <div id="tvname"></div>
    <a id="tvsite" href="#" target="_blank" rel="noopener">Ιστότοπος ↗</a>
  </div>
  <video id="tvvid" controls playsinline autoplay></video>
  <div id="tvmsg" style="display:none"></div>
</div>

<div id="eps">
  <div id="epsh">
    <div id="epstitle"></div>
    <button id="epsclose" aria-label="close">✕</button>
  </div>
  <div id="epslist"></div>
</div>

<script>
const RAW = 'https://raw.githubusercontent.com/possiblelife/gtrvlst/main/';
const state = {
  tab: 'radio', q: '', group: '',
  stations: [], shows: [], tv: [],
  fav: new Set(JSON.parse(localStorage.fav || '[]')),
  rec: JSON.parse(localStorage.rec || '[]'),
  filtered: [], cur: -1,
};

const audio = new Audio();
audio.preload = 'none';
const $ = id => document.getElementById(id);
const listEl = $('list');

function save() {
  localStorage.fav = JSON.stringify([...state.fav]);
  localStorage.rec = JSON.stringify(state.rec.slice(0, 12));
}

/* ---------- radio ---------- */
function playRadio(i) {
  const st = state.filtered[i]; if (!st) return;
  state.cur = i;
  audio.src = st.u; audio.play().catch(() => {});
  state.rec = [st.u, ...state.rec.filter(u => u !== st.u)].slice(0, 12);
  save(); render(); showPlayer(st);
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: st.n, artist: st.g || 'Greek Radio', album: 'Ελληνικό Ραδιόφωνο',
      artwork: st.l ? [{ src: st.l, sizes: '256x256' }] : []
    });
  }
}
function showPlayer(st) {
  $('player').classList.add('show');
  $('pname').textContent = st.n;
  $('pimg').src = st.l || 'icon-180.png';
  setStat('Σύνδεση…', false);
}
function setStat(t, live) {
  const e = $('pstat'); e.textContent = t; e.className = live ? 'live' : '';
}
audio.addEventListener('playing', () => { setStat('ΕΚΠΟΜΠΗ · ON AIR', true); $('ppause').textContent = '❚❚'; });
audio.addEventListener('waiting', () => setStat('Buffering…', false));
audio.addEventListener('error', () => setStat('Δεν συνδέεται — ίσως χρειάζεται VPN', false));
audio.addEventListener('pause', () => { setStat('Παύση · Paused', false); $('ppause').textContent = '▶'; });
$('ppause').onclick = () => { if (audio.paused) audio.play().catch(()=>{}); else audio.pause(); };
$('pstop').onclick = () => {
  audio.pause(); audio.removeAttribute('src'); audio.load();
  $('player').classList.remove('show'); state.cur = -1; render();
};

/* ---------- live tv ---------- */
function playTV(i) {
  const ch = state.filtered[i]; if (!ch) return;
  audio.pause();
  $('tv').classList.add('show');
  $('tvname').textContent = ch.n;
  $('tvsite').href = ch.w || '#';
  const v = $('tvvid');
  v.style.display = ''; $('tvmsg').style.display = 'none';
  v.src = ch.u; v.play().catch(() => {});
  v.onerror = () => {
    v.style.display = 'none';
    const m = $('tvmsg');
    m.style.display = '';
    m.textContent = ch.v
      ? 'Το κανάλι δεν αναπαράγεται. Δοκιμάστε με VPN ενεργό. / Try again with VPN on.'
      : 'Το κανάλι δεν είναι διαθέσιμο αυτή τη στιγμή. / Channel temporarily unavailable.';
  };
}
$('tvback').onclick = () => {
  const v = $('tvvid'); v.pause(); v.removeAttribute('src'); v.load();
  $('tv').classList.remove('show');
};

/* ---------- shows (VOD) ---------- */
function openShow(sh) {
  $('eps').classList.add('show');
  $('epstitle').textContent = sh.n + ' — ' + sh.c;
  $('epslist').innerHTML = '<div class="spin">Φόρτωση επεισοδίων…</div>';
  fetch(RAW + sh.p).then(r => r.text()).then(txt => {
    const eps = [];
    let meta = {};
    for (const raw of txt.split('\n')) {
      const line = raw.replace(/\r/g, '').trim();
      if (line.startsWith('#EXTINF')) {
        const g = line.match(/group-title="([^"]*)"/);
        meta = { g: g ? g[1] : '', n: line.includes(',') ? line.split(',').pop().trim() : '' };
      } else if (line.startsWith('http')) {
        eps.push({ n: meta.n, g: meta.g, u: line.split('|')[0].trim() });
      }
    }
    if (!eps.length) {
      $('epslist').innerHTML = '<div class="spin">Δεν βρέθηκαν επεισόδια</div>';
      return;
    }
    $('epslist').innerHTML = eps.map((e, i) =>
      `<div class="ep" data-e="${i}">
         <div><div class="en">${esc(e.n || 'Επεισόδιο')}</div><div class="eg">${esc(e.g)}</div></div>
         <span class="go">▶</span>
       </div>`).join('');
    $('epslist').querySelectorAll('.ep').forEach(el =>
      el.addEventListener('click', () => window.open(eps[+el.dataset.e].u, '_blank')));
  }).catch(() => {
    $('epslist').innerHTML = '<div class="spin">Σφάλμα φόρτωσης — δοκιμάστε ξανά</div>';
  });
}
$('epsclose').onclick = () => $('eps').classList.remove('show');
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

/* ---------- rendering ---------- */
function rowHTML(st, i, tv) {
  const fav = state.fav.has(st.u);
  return `<div class="st ${tv ? 'tv' : ''} ${state.cur === i && !tv ? 'playing' : ''}" data-i="${i}">
    ${st.l ? `<img src="${st.l}" loading="lazy" onerror="this.style.visibility='hidden'">`
           : `<img src="icon-180.png">`}
    <div class="m"><div class="n">${esc(st.n)}</div><div class="g">${esc(st.g || '')}</div></div>
    ${st.v ? '<span class="badge">VPN</span>' : ''}
    ${state.cur === i && !tv ? '<span class="live"></span>' : ''}
    <span class="fav ${fav ? 'on' : ''}" data-fav="${i}">${fav ? '★' : '☆'}</span>
  </div>`;
}
function showRowHTML(sh, i) {
  return `<div class="st" data-show="${i}">
    <img src="icon-180.png">
    <div class="m"><div class="n">${esc(sh.n)}</div><div class="g">${esc(sh.c)} · ${esc(sh.s)}</div></div>
    <span class="fav" style="color:var(--acc)">▶</span>
  </div>`;
}

function render() {
  const q = state.q.trim().toLowerCase();
  let items, tv = state.tab === 'tv', shows = state.tab === 'shows';
  if (tv) items = state.tv; else if (shows) items = state.shows; else items = state.stations;

  let favs = [], recs = [], rest = [];
  const recSet = new Set(state.rec);
  items.forEach(st => {
    const hay = (st.n + ' ' + (st.g || '') + ' ' + (st.c || '') + ' ' + (st.s || '')).toLowerCase();
    if (state.group && (st.g || st.c) !== state.group) return;
    if (q && !hay.includes(q)) return;
    if (!shows && !tv && state.fav.has(st.u)) favs.push(st);
    else if (!shows && !tv && recSet.has(st.u)) recs.push(st);
    else rest.push(st);
  });
  recs.sort((a, b) => state.rec.indexOf(a.u) - state.rec.indexOf(b.u));
  state.filtered = shows ? rest : [...favs, ...recs, ...rest];
  const idx = u => state.filtered.findIndex(s => s.u === u);

  let html = '';
  if (!shows && !tv && !q && !state.group) {
    if (favs.length) html += `<div class="sec">★ Αγαπημένα · Favorites</div>` + favs.map(s => rowHTML(s, idx(s.u))).join('');
    if (recs.length) html += `<div class="sec">▸ Πρόσφατα · Recent</div>` + recs.map(s => rowHTML(s, idx(s.u))).join('');
    html += `<div class="sec">Όλοι οι σταθμοί · All stations</div>`;
  }
  if (shows) html += rest.map(s => showRowHTML(s, state.filtered.indexOf(s))).join('');
  else html += rest.map(s => rowHTML(s, idx(s.u))).join('');
  if (!state.filtered.length && !favs.length && !recs.length)
    html = '<div class="empty">Δεν βρέθηκαν αποτελέσματα<br>Nothing found</div>';
  listEl.innerHTML = html;
}

listEl.addEventListener('click', e => {
  const favEl = e.target.closest('[data-fav]');
  if (favEl && state.tab === 'radio') {
    const st = state.filtered[+favEl.dataset.fav];
    if (st) { state.fav.has(st.u) ? state.fav.delete(st.u) : state.fav.add(st.u); save(); render(); }
    e.stopPropagation(); return;
  }
  const showEl = e.target.closest('[data-show]');
  if (showEl) { openShow(state.filtered[+showEl.dataset.show]); return; }
  const row = e.target.closest('.st');
  if (!row) return;
  if (state.tab === 'radio') playRadio(+row.dataset.i);
  else if (state.tab === 'tv') playTV(+row.dataset.i);
});

/* ---------- tabs & chips ---------- */
document.querySelectorAll('.tab').forEach(t =>
  t.addEventListener('click', () => {
    state.tab = t.dataset.t; state.group = ''; state.q = ''; $('search').value = '';
    document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
    buildChips(); render();
  }));
$('search').addEventListener('input', e => { state.q = e.target.value; render(); });

function buildChips() {
  let groups, items;
  if (state.tab === 'tv') items = state.tv;
  else if (state.tab === 'shows') items = state.shows;
  else items = state.stations;
  const key = st => st.g || st.c || '';
  const counts = {};
  items.forEach(st => { const k = key(st); if (k) counts[k] = (counts[k] || 0) + 1; });
  groups = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
  const label = state.tab === 'shows' ? 'Όλα' : 'Όλες';
  $('chips').innerHTML =
    `<span class="chip ${state.group ? '' : 'on'}" data-g="">${label} (${items.length})</span>` +
    groups.map(g => `<span class="chip ${state.group === g ? 'on' : ''}" data-g="${esc(g)}">${esc(g)} (${counts[g]})</span>`).join('');
  $('chips').querySelectorAll('.chip').forEach(c =>
    c.addEventListener('click', () => { state.group = c.dataset.g; buildChips(); render(); }));
}

/* ---------- boot ---------- */
Promise.all([
  fetch('stations.json').then(r => r.json()),
  fetch('tv_live.json').then(r => r.json()),
  fetch('shows.json').then(r => r.json()),
]).then(([stations, tv, shows]) => {
  state.stations = stations; state.tv = tv; state.shows = shows;
  buildChips(); render();
});
</script>
</body>
</html>
